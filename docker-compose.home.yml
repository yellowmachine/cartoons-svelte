# Stack de casa, junto a Jellyfin: jellyfin-bridge y cloudflared. El VPS llega
# al bridge solo por el túnel de Cloudflare; Jellyfin no se expone a internet.
#
# Requerido en un .env junto a este fichero:
#   JELLYFIN_URL=<Jellyfin visto desde el contenedor, p.ej. http://host.docker.internal:8096>
#   JELLYFIN_USER_ID=<id del usuario>
#   JELLYFIN_API_KEY=<API key de Jellyfin>
#   BRIDGE_API_TOKEN=<openssl rand -hex 32>   (mismo valor que JELLYFIN_BRIDGE_TOKEN en la app)
#   CLOUDFLARE_TUNNEL_TOKEN=<de Zero Trust > Networks > Tunnels>
#
# Arranque: docker compose -f docker-compose.home.yml up -d

services:
  jellyfin-bridge:
    image: ghcr.io/yellowmachine/cartoons-svelte-jellyfin-bridge:latest
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:?set JELLYFIN_URL in .env}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:?set JELLYFIN_USER_ID in .env}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in .env}
      API_TOKEN: ${BRIDGE_API_TOKEN:?set BRIDGE_API_TOKEN in .env}
      # Escucha en la red de compose para que cloudflared llegue; sin `ports`,
      # así que no es accesible desde el host ni desde la LAN.
      LISTEN_ADDR: 0.0.0.0:8787
    # Si Jellyfin corre en el host (no en este compose).
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  cloudflared:
    image: cloudflare/cloudflared:latest
    # El hostname público del túnel apunta a http://jellyfin-bridge:8787 (se
    # configura en el panel de Cloudflare) y está protegido por una
    # aplicación de Cloudflare Access con un Service Token.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - jellyfin-bridge
    restart: unless-stopped
