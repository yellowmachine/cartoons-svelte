name: jellyfin-bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jellyfin-bridge.yml'
      - 'jellyfin-bridge/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/jellyfin-bridge.yml'
      - 'jellyfin-bridge/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jellyfin-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: jellyfin-bridge/go.mod
          cache-dependency-path: jellyfin-bridge/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-jellyfin-bridge
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Sin QEMU: el Dockerfile compila cruzado en la plataforma del runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: jellyfin-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jellyfin-bridge
          cache-to: type=gha,mode=max,scope=jellyfin-bridge

  # Pide al bridge (por el túnel) que Watchtower actualice su imagen. Sin los
  # secretos configurados, se salta con un aviso.
  update-home:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      BRIDGE_URL: ${{ secrets.JELLYFIN_BRIDGE_URL }}
      UPDATE_TOKEN: ${{ secrets.JELLYFIN_BRIDGE_UPDATE_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$BRIDGE_URL" ] || [ -z "$UPDATE_TOKEN" ]; then
            echo "::notice::JELLYFIN_BRIDGE_URL o JELLYFIN_BRIDGE_UPDATE_TOKEN sin configurar; no se avisa al bridge"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      # Si se avisa antes de que GHCR propague el tag, Watchtower bajaría la
      # imagen anterior: se espera a que `:latest` resuelva a nuestro digest.
      - name: Wait for GHCR latest tag to reflect pushed digest
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}-jellyfin-bridge"
          target="${{ needs.build-and-push.outputs.digest }}"
          for i in $(seq 1 30); do
            current=$(docker buildx imagetools inspect "$image:latest" 2>/dev/null \
              | awk '/^Digest:/ { print $2; exit }')
            if [ "$current" = "$target" ]; then
              echo "Matched after $i attempt(s): $current"
              exit 0
            fi
            echo "Attempt $i/30: latest is '$current', want '$target' — retrying in 5s"
            sleep 5
          done
          echo "::error::Timed out waiting for $image:latest to reflect $target"
          exit 1

      # 409 = Watchtower ya está actualizando (p.ej. su chequeo diario); se
      # reintenta para que la actualización que corra vea la imagen nueva.
      - name: Trigger update through the bridge
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          for i in $(seq 1 6); do
            status=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
              -X POST "${BRIDGE_URL%/}/admin/update" \
              -H "Authorization: Bearer $UPDATE_TOKEN" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            echo "Attempt $i: HTTP $status $(cat /tmp/response.txt)"
            case "$status" in
              202) exit 0 ;;
              409) sleep 30 ;;
              *) echo "::error::El bridge respondió HTTP $status"; exit 1 ;;
            esac
          done
          echo "::error::Watchtower sigue ocupado tras varios intentos"
          exit 1
